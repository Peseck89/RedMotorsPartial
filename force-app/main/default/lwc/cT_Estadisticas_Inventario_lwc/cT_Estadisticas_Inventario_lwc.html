<template>
    <lightning-card title="Reporte de Estadísticas - Vehículos Usados" icon-name="custom:custom84">
        <div class="slds-m-around_medium">
            
            <!-- Filtros -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input 
                        type="text" 
                        label="Marca" 
                        value={marcaFiltro}
                        onchange={handleMarcaChange}
                        placeholder="Filtrar por marca">
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input 
                        type="text" 
                        label="Modelo" 
                        value={modeloFiltro}
                        onchange={handleModeloChange}
                        placeholder="Filtrar por modelo">
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <lightning-input 
                        type="text" 
                        label="Año" 
                        value={anioFiltro}
                        onchange={handleAnioChange}
                        placeholder="Filtrar por año">
                    </lightning-input>
                </div>
                <!-- <div class="slds-col slds-size_1-of-4 slds-align_absolute-center">
                    <lightning-button 
                        label="Exportar a Excel" 
                        icon-name="utility:download"
                        onclick={exportToExcel}
                        class="slds-m-top_large">
                    </lightning-button>
                </div> -->
            </div>
            
            <!-- Resumen -->
            <div class="slds-grid slds-wrap slds-m-top_medium">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <h3 class="slds-text-heading_small">Total Modelos</h3>
                        <p class="slds-text-heading_medium slds-text-color_success">{totalModelos}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <h3 class="slds-text-heading_small">Total Inventario</h3>
                        <p class="slds-text-heading_medium slds-text-color_success">{totalInventario}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <h3 class="slds-text-heading_small">Total Recibos</h3>
                        <p class="slds-text-heading_medium slds-text-color_warning">{totalRecibos}</p>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-text-align_center">
                        <h3 class="slds-text-heading_small">Ventas (6 meses)</h3>
                        <p class="slds-text-heading_medium slds-text-color_success">{totalVentas}</p>
                    </div>
                </div>
            </div>
            
            <!-- Tabla de resultados -->
            <div class="slds-m-top_large">
                <lightning-datatable
                    key-field="id"
                    columns={columns}
                    data={datosPaginados}
                    is-loading={loading}
                    default-sort-direction={defaultSortDirection}
                    sorted-direction={sortDirection}
                    sorted-by={sortedBy}
                    onsort={onHandleSort}
                    hide-checkbox-column
                    show-row-number-column
                    row-number-offset="0">
                </lightning-datatable>
            </div>
            
            <!-- Paginación -->
            <div class="slds-grid slds-m-top_medium slds-align_absolute-center">
                <lightning-button 
                    label="Anterior" 
                    onclick={previousPage}
                    disabled={isFirstPage}>
                </lightning-button>
                <span class="slds-m-horizontal_medium slds-align-self_center">
                    Página {currentPage} de {totalPages}
                </span>
                <lightning-button 
                    label="Siguiente" 
                    onclick={nextPage}
                    disabled={isLastPage}>
                </lightning-button>
            </div>
            
        </div>
    </lightning-card>
</template>
